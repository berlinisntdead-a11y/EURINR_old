name: Scrape EUR→INR rates

on:
  schedule:
    # Mondays and Thursdays, 09:47 Paris summer time (07:47 UTC): captures 3–4 days apart.
    - cron: '47 7 * * 1,4'
  workflow_dispatch:
    inputs:
      providers:
        description: 'Comma list (wise,xe,instarem,remitly,skrill,revolut) or "all"'
        default: all
      debug:
        description: 'Print raw API responses'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape-rates
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Scrape
        id: scrape
        # Exits 1 if any provider failed; rows from the others are still written and committed below.
        run: python scraper/scrape_rates.py --providers "${{ inputs.providers || 'all' }}" ${{ inputs.debug && '--debug' || '' }}

      - name: Commit new rows
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/EURINR_data.xlsx data/eurinr_quotes.csv
          if git diff --cached --quiet; then
            echo "No new rows"
          else
            git commit -m "Scraped EUR→INR rates $(TZ=Europe/Paris date +%Y-%m-%d)"
            git push
          fi
